name: vysegrow_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  carousel_slider: ^5.0.0
  url_launcher: ^6.2.5
  flutter_widget_from_html: ^0.15.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.8.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  web: ^1.1.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/applogo.png
    - assets/app_icon.png